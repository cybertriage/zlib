# Builds the zlib static library that the Cyber Triage collector links, for
# 32-bit Windows: zlibstat.lib, with Cyber Triage's SHA-256 hashing of gzip
# output, built once with the v141_xp toolset so that every collector
# configuration can link it. It compiles against the Mbed TLS package that
# ct/mbedtls.json pins, and the probe checks it links into each toolset and C
# runtime the collector uses. Every run keeps the package as a workflow
# artifact. Pushing a ct-* tag also publishes it, with SHA256SUMS, as a GitHub
# release. See ct/README.md.
name: ct_release
on:
  push:
    # ct-1.4 and work branches such as ct-1.4-next.
    branches:
    - 'ct-*'
    tags:
    - 'ct-*'
  pull_request:
    branches:
    - ct-1.4
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Name the build
      id: name
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="$(git rev-parse --short=12 HEAD)"; fi
        echo "package=zlib-${NAME}-win32" >> "${GITHUB_OUTPUT}"
    - name: Install the XP toolset
      # MSVC 14.16 (v141) and Windows XP support, which adds the v141_xp toolset
      # and the Windows 7.1A SDK. The installer sometimes needs a second run.
      run: |
        $vs = & "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $arguments = @('modify', '--installPath', "`"$vs`"",
          '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
          '--add', 'Microsoft.VisualStudio.Component.WinXP',
          '--quiet', '--norestart', '--nocache')
        foreach ($attempt in 1, 2) {
          $process = Start-Process -FilePath "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          Write-Output "vs_installer attempt ${attempt} exited with $($process.ExitCode)"
          $toolset = Get-ChildItem -Path "$vs\MSBuild\Microsoft\VC" -Recurse -Directory -Filter v141_xp -ErrorAction SilentlyContinue
          if ($toolset -and (Test-Path "${Env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v7.1A\Include\Windows.h")) { break }
        }
        if (-not $toolset) { Write-Error "the v141_xp toolset is not installed"; Exit 1 }
        $toolset | ForEach-Object { Write-Output $_.FullName }
    - name: Fetch Mbed TLS
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python ct\ci.py fetch-mbedtls mbedtls
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
        $package = Get-ChildItem -Path mbedtls -Directory -Filter 'mbedtls-*-win32' | Select-Object -First 1
        "MBEDTLS=$($package.FullName)" | Out-File -FilePath ${Env:GITHUB_ENV} -Append -Encoding utf8
    - name: Configure
      # /Zl: the objects name no C runtime, so the library links into /MT, /MD
      # and /MDd executables without LNK4098. No /GL: link-time code generation
      # objects only link with the exact compiler that made them. /Z7 keeps
      # debug info in the objects, so there is no PDB to ship or to miss.
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -T v141_xp `
          -DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_TESTING=OFF -DZLIB_INSTALL=OFF `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          "-DCMAKE_C_FLAGS=/DWIN32 /D_WINDOWS /W3 /DZLIB_WINAPI /I$($Env:MBEDTLS.Replace('\', '/'))/include" `
          "-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7 /Zl"
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
    - name: Build
      run: |
        cmake --build build --config Release --parallel
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
    - name: Check the library
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        New-Item -ItemType Directory -Path "dist\${Env:PACKAGE}" | Out-Null
        Copy-Item -Path build\Release\libzs.lib -Destination "dist\${Env:PACKAGE}\zlibstat.lib"
        Copy-Item -Path zlib.h, build\zconf.h, LICENSE -Destination "dist\${Env:PACKAGE}"
        python ct\ci.py check --lib "dist\${Env:PACKAGE}\zlibstat.lib" | Tee-Object -FilePath build\check.txt
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
    - name: Build and run the probes
      # Each toolset and C runtime a collector configuration links zlibstat.lib
      # with, against the Mbed TLS library for the same configuration.
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        $probes = @(
          @{ Name = 'v141_xp-MT';  Toolset = 'v141_xp'; Runtime = 'MultiThreaded';         Config = 'Release'; Mbed = 'Release_XPNoLibs' },
          @{ Name = 'v142-MT';     Toolset = 'v142';    Runtime = 'MultiThreaded';         Config = 'Release'; Mbed = 'Release_NoLibs' },
          @{ Name = 'v142-MD';     Toolset = 'v142';    Runtime = 'MultiThreadedDLL';      Config = 'Release'; Mbed = 'Release' },
          @{ Name = 'v142-MDd';    Toolset = 'v142';    Runtime = 'MultiThreadedDebugDLL'; Config = 'Debug';   Mbed = 'Debug' }
        )
        $include = "${Env:GITHUB_WORKSPACE}/dist/${Env:PACKAGE}".Replace('\', '/')
        $mbedtls = $Env:MBEDTLS.Replace('\', '/')
        foreach ($probe in $probes) {
          "== probe $($probe.Name)" | Tee-Object -FilePath build\probes.txt -Append
          cmake -S ct -B "build-probe-$($probe.Name)" -G "Visual Studio 17 2022" -A Win32 -T $probe.Toolset `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=$($probe.Runtime)" `
            "-DCMAKE_C_FLAGS=/DWIN32 /D_WINDOWS /W3 /DZLIB_WINAPI /DUNICODE /D_UNICODE" `
            "-DZLIB_INCLUDE=$include" "-DZLIB_LIB=$include/zlibstat.lib" `
            "-DMBEDTLS_INCLUDE=$mbedtls/include" "-DMBEDTLS_LIB=$mbedtls/$($probe.Mbed)/mbedTLS.lib"
          If (${LASTEXITCODE} -ne 0) { Exit 1 }
          cmake --build "build-probe-$($probe.Name)" --config $probe.Config
          If (${LASTEXITCODE} -ne 0) { Exit 1 }
          python ct\ci.py run-probe --exe "build-probe-$($probe.Name)\$($probe.Config)\probe.exe" --dir "build-probe-$($probe.Name)\out" | Tee-Object -FilePath build\probes.txt -Append
          If (${LASTEXITCODE} -ne 0) { Exit 1 }
        }
    - name: Package
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        $pin = Get-Content ct\mbedtls.json -Raw | ConvertFrom-Json
        $mbedSource = (Get-Content "${Env:MBEDTLS}\SOURCE.txt" | Select-Object -First 2) -join "`n           "
        if ($pin.tag) { $mbedFrom = "release $($pin.tag) of $($pin.repo)" } else { $mbedFrom = "ct_release run $($pin.run_id) of $($pin.repo), before its first release" }
        $version = (Select-String -Path zlib.h -Pattern '#define ZLIB_VERSION "(.+)"').Matches[0].Groups[1].Value
        $compiler = [regex]::Match((Get-Content build\check.txt -Raw), "'(19\.\d+\.\d+)'").Groups[1].Value
        @(
          "zlibstat.lib, zlib ${version} with Cyber Triage's SHA-256 hashing of gzip output, for the Cyber Triage collector, 32-bit Windows."
          "Source:  ${Env:GITHUB_SERVER_URL}/${Env:GITHUB_REPOSITORY}/tree/${Env:GITHUB_SHA}"
          "Build:   ${Env:GITHUB_SERVER_URL}/${Env:GITHUB_REPOSITORY}/actions/runs/${Env:GITHUB_RUN_ID}"
          "Changes from upstream zlib: see ct/README.md at the source commit."
          "Mbed TLS: compiled against $($pin.asset), SHA-256 $($pin.sha256),"
          "          from ${mbedFrom}:"
          "           ${mbedSource}"
          "          Link the mbedTLS.lib from that Mbed TLS package: z_stream holds its mbedtls_sha256_context."
          "Toolset: v141_xp, cl ${compiler}"
          "Flags:   ZLIB_WINAPI (stdcall), /MT code that names no C runtime (/Zl), no /GL, /Z7."
          "Probed:  links and passes in v141_xp /MT, v142 /MT, v142 /MD and v142 /MDd executables; see BUILD.txt."
          "Licence: zlib, see LICENSE."
        ) | Set-Content -Path "dist\${Env:PACKAGE}\SOURCE.txt" -Encoding ascii
        Get-Content build\check.txt, build\probes.txt | Set-Content -Path "dist\${Env:PACKAGE}\BUILD.txt" -Encoding ascii
        Get-Content "dist\${Env:PACKAGE}\SOURCE.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lib-zlib
        path: dist/
        if-no-files-found: error
    outputs:
      package: ${{ steps.name.outputs.package }}
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: lib-zlib
        path: dist
    - name: Package
      env:
        PACKAGE: ${{ needs.build.outputs.package }}
      run: |
        test -f "dist/${PACKAGE}/zlibstat.lib"
        (cd dist && zip -qr "${PACKAGE}.zip" "${PACKAGE}")
        ls -l dist
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ needs.build.outputs.package }}
        path: dist/${{ needs.build.outputs.package }}.zip
        if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: zlib-*
        path: dist
        merge-multiple: true
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd dist
        sha256sum -- * > SHA256SUMS
        cat SHA256SUMS
        gh release create "${GITHUB_REF_NAME}" \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --notes "zlib with SHA-256 hashing of gzip output, for the Cyber Triage collector, 32-bit Windows, built from ${GITHUB_SHA}. See ct/README.md for what differs from upstream zlib and which Mbed TLS release it needs." \
          -- *
